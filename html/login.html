<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechNova - Đăng nhập</title>
<link rel="stylesheet" href="../css/login.css">
</head>
<body>

<div class="wrap" >

  <button type="button" class="close-btn" id="closeBtn" title="Đóng">✕</button>

  <!-- Panel bên trái: thương hiệu -->
  <div class="side">
    <div>
      <div class="brand"><span class="brand-dot"></span>TechNova</div>
      <h2>Học Frontend, AI &amp; DevOps<br>cùng cộng đồng TechNova</h2>
      <p>Tham gia để lưu bài viết yêu thích, theo dõi lộ trình học và nhận gợi ý nội dung phù hợp với bạn.</p>
      <div class="tags">
        <img src="../assets/imgs/logo.png" alt="">
      </div>
    </div>
    <!-- <div class="foot">© 2026 TechNova. Nền tảng học lập trình cho người mới bắt đầu.</div> -->
  </div>

  <!-- Panel bên phải: form đăng nhập -->
  <div class="form-side">
    <p class="title">Chào mừng trở lại</p>
    <p class="subtitle">Đăng nhập để tiếp tục hành trình học tập của bạn.</p>

    <form onsubmit="return false;">
      <div class="field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="name@example.com" required>
      </div>
      <div class="field">
        <label for="loginPass">Mật khẩu</label>
        <input type="password" id="loginPass" placeholder="Nhập mật khẩu" required>
      </div>

      <div class="row-between">
        <label class="checkline"><input type="checkbox"> Ghi nhớ đăng nhập</label>
        <a href="#" class="link">Quên mật khẩu?</a>
      </div>

      <button class="btn-primary" type="submit">Đăng nhập</button>
    </form>

    <div class="divider">HOẶC</div>
    <div class="socials">
      <button class="btn-social" type="button">Google</button>
      <button class="btn-social" type="button">GitHub</button>
    </div>

    <p class="switch-hint">Chưa có tài khoản? <a href="register.html" class="link">Đăng ký ngay</a></p>
  </div>

</div>

<script>
document.getElementById('closeBtn').addEventListener('click', () => {
  if (document.referrer) {
    window.history.back();
  }
});
</script>

</body>
</html>
